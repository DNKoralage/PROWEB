<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Admin — Devnith Koralage Creative Studio</title>
  <meta name="description" content="Secure admin dashboard for the Devnith Koralage Creative Studio portfolio.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04160f">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="uploads/favicon.svg" type="image/svg+xml">

  <!-- Fonts: loaded with a non-blocking swap so the login never stalls -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Clash+Display:wght@500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Clash+Display:wght@500;600;700&display=swap">
  </noscript>

  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/admin.css">

  <!-- Inline critical colour so there is no white flash before CSS. -->
  <style>
    html, body { background: #010705; color: #f2fff8; margin: 0; }
    .dk-boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 500 0.7rem/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.3em; text-transform: uppercase; color: #31e0a1;
    }
  </style>
</head>
<body>
  <!-- Everything below is rendered by admin.js. -->
  <div id="admin-root">
    <div class="dk-boot">Studio admin</div>
  </div>

  <noscript>
    <div style="padding:3rem 1.5rem;max-width:60ch;margin:0 auto">
      <h1>Studio Admin</h1>
      <p>The dashboard uses JavaScript. Please enable it to manage the site.</p>
    </div>
  </noscript>

  <!-- Shared helpers + procedural art, then the dashboard itself. -->
  <script src="assets/js/common.js"></script>
  <script src="assets/js/firebase-bridge.js"></script>
  <script src="assets/js/foliage.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
