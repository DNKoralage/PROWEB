<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Devnith Koralage Creative Studio — design, photography &amp; film</title>
  <meta name="description" content="Devnith Koralage Creative Studio — a multidisciplinary portfolio: logos, graphic design campaigns, photography and film.">
  <meta name="theme-color" content="#04160f">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Devnith Koralage Creative Studio — design, photography &amp; film">
  <meta property="og:description" content="Logos, graphic design campaigns, photography and film.">
  <meta property="og:image" content="uploads/og.svg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Real raster files are optional; the SVG icon works in every modern browser -->
  <link rel="icon" href="uploads/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="uploads/favicon.svg">
  <link rel="mask-icon" href="uploads/favicon.svg" color="#31e0a1">

  <!-- Fonts: loaded with a non-blocking swap so the intro never stalls -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Clash+Display:wght@500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Clash+Display:wght@500;600;700&display=swap">
  </noscript>

  <link rel="stylesheet" href="assets/css/site.css">

  <!-- Inline critical shell colour so there is no white flash before CSS. -->
  <style>
    html, body { background: #010705; color: #f2fff8; margin: 0; }
    .dk-boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 500 0.7rem/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.3em; text-transform: uppercase; color: #31e0a1;
    }
  </style>
</head>
<body>
  <!-- Everything below is rendered by site.js from data/content.js -->
  <div id="dk-app">
    <div class="dk-boot">Loading the studio</div>
  </div>

  <noscript>
    <div style="padding:3rem 1.5rem;max-width:60ch;margin:0 auto">
      <h1>DK</h1>
      <p>This portfolio uses JavaScript to display the work. Please enable it to view the site.</p>
    </div>
  </noscript>

  <!-- Load order matters: shared helpers, then art/audio, then the renderer. -->
  <script src="assets/js/common.js"></script>
  <script src="assets/js/firebase-bridge.js"></script>
  <script src="assets/js/foliage.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/parallax.js"></script>
  <script src="assets/js/radio.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
